server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path that isn't a real file falls back to index.html so
    # React Router's client-side routes (e.g. /despesas/123) work on a
    # hard refresh, not just on in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.svg {
        access_log off;
    }
}
